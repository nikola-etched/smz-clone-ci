[workspace]
members = ["crates/fusion-core", "crates/fusion-sim"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/nikola-etched/smz-clone-ci"

[workspace.dependencies]
anyhow = "1.0"
approx = "0.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
